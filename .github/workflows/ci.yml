name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 'lint · typecheck · test · build (node ${{ matrix.node }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (with per-package coverage thresholds)
        run: npm run test

      - name: Build
        run: npm run build

      - name: Contract drift gate (generated shared-types must be current)
        run: |
          npm run gen:types
          if ! git diff --exit-code -- packages/shared-types; then
            echo "::error::packages/shared-types is stale — run 'npm run gen:types' and commit the result"
            git diff -- packages/shared-types
            exit 1
          fi

      - name: Dependency audit gate (production deps)
        run: npm audit --omit=dev --audit-level=high

